<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jarvis Interface (Stable)</title>
    <style>
        body { 
            background-color: #000; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
            margin: 0; 
        }
        
        /* THE CORE */
        #core {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #003333;
            box-shadow: 0 0 15px #00ffcc22;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 40px;
        }

        /* STATES */
        .listening {
            border-color: #00ffcc;
            box-shadow: 0 0 30px #00ffcc66;
            animation: breathe 2s infinite ease-in-out;
        }
        .speaking {
            border-color: #ff3300;
            box-shadow: 0 0 50px #ff3300;
            transform: scale(1.1);
        }
        .processing {
            border-color: #ffff00;
            box-shadow: 0 0 30px #ffff00;
            animation: spin 1s infinite linear;
        }

        @keyframes breathe {
            0% { box-shadow: 0 0 10px #00ffcc66; }
            50% { box-shadow: 0 0 30px #00ffcc; }
            100% { box-shadow: 0 0 10px #00ffcc66; }
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        #log { 
            width: 90%; max-width: 600px; height: 150px; 
            overflow-y: auto; border-top: 1px solid #333; 
            padding: 10px; font-size: 14px; color: #888; 
            text-align: left; background: #111;
        }
        .user { color: #fff; }
        .jarvis { color: #00ffcc; font-weight: bold; }
        .error { color: #ff3300; }
    </style>
</head>
<body>

    <div id="core" onclick="startSystem()">⚛️</div>
    <div id="status">CLICK TO START</div>
    <div id="log"></div>

    <script>
        // --- CONFIG ---
        const BACKEND_URL = "ws://localhost:8000/ws/chat"; // Change to Ngrok URL if needed
        const WAKE_WORD = "jarvis";
        // --------------

        let ws;
        let recognition;
        let isSpeaking = false;
        let micActive = false;
        let speakTimeout;

        const statusDiv = document.getElementById("status");
        const core = document.getElementById("core");
        const logDiv = document.getElementById("log");

        // 1. CONNECT TO BACKEND
        function connectWebSocket() {
            ws = new WebSocket(BACKEND_URL);
            
            ws.onopen = () => log("System: Neural Link Established.");
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "response") {
                    log("🧠 Jarvis: " + data.text, "jarvis");
                    speak(data.text);
                }
            };

            ws.onclose = () => {
                log("System: Disconnected. Retrying...", "error");
                setTimeout(connectWebSocket, 3000); // Auto-reconnect
            };
        }

        // 2. SETUP MICROPHONE (The Ears)
        function setupMic() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Recognition) {
                alert("Browser not supported. Use Chrome.");
                return;
            }

            recognition = new Recognition();
            recognition.continuous = true; // Keep listening
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                micActive = true;
                if (!isSpeaking) setVisuals("listening");
            };

            recognition.onend = () => {
                micActive = false;
                // If we aren't speaking, microphone died unexpectedly. RESUSCITATE IT!
                if (!isSpeaking) {
                    console.log("Mic died. Restarting...");
                    setVisuals("error"); // Flash red briefly
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
                }
            };

            recognition.onresult = (event) => {
                if (isSpeaking) return;

                const last = event.results.length - 1;
                const text = event.results[last][0].transcript.trim().toLowerCase();
                
                console.log("Heard:", text);

                if (text.includes(WAKE_WORD)) {
                    setVisuals("processing");
                    log("🗣️ You: " + text, "user");
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "command", text: text }));
                    } else {
                        log("Error: Backend offline", "error");
                    }
                }
            };
        }

        // 3. TEXT TO SPEECH (The Mouth)
        function speak(text) {
            isSpeaking = true;
            try { recognition.stop(); } catch(e){} // Stop mic to prevent echo
            
            setVisuals("speaking");
            statusDiv.innerText = "SPEAKING...";

            const utterance = new SpeechSynthesisUtterance(text);
            
            // Safety: If speaking gets stuck for 15s, kill it and reset
            clearTimeout(speakTimeout);
            speakTimeout = setTimeout(() => {
                console.warn("TTS Stuck. Forcing reset.");
                isSpeaking = false;
                try { recognition.start(); } catch(e){}
            }, 15000);

            utterance.onend = () => {
                clearTimeout(speakTimeout);
                isSpeaking = false;
                // Resume listening instantly
                try { recognition.start(); } catch(e){}
            };

            window.speechSynthesis.speak(utterance);
        }

        // 4. UTILITIES
        function setVisuals(state) {
            core.className = ""; // Reset
            core.classList.add(state);
            
            if(state === "listening") statusDiv.innerText = "LISTENING...";
            if(state === "processing") statusDiv.innerText = "THINKING...";
            if(state === "error") statusDiv.innerText = "RESTARTING...";
        }

        function log(msg, cls = "") {
            logDiv.innerHTML += `<div class="${cls}">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function startSystem() {
            connectWebSocket();
            setupMic();
            try { recognition.start(); } catch(e){}
            
            // Watchdog: Check every 5 seconds if mic is alive
            setInterval(() => {
                if (!micActive && !isSpeaking) {
                    console.log("Watchdog: Restarting mic...");
                    try { recognition.start(); } catch(e){}
                }
            }, 5000);
        }
    </script>
</body>
</html>
