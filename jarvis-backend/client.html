<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jarvis Voice Interface</title>
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        /* The Arc Reactor Circle */
        #core {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #004444;
            box-shadow: 0 0 20px #00ffcc33;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            cursor: pointer;
        }

        /* Active State (When hearing "Jarvis") */
        .active {
            border-color: #00ffcc !important;
            box-shadow: 0 0 50px #00ffcc, inset 0 0 20px #00ffcc !important;
            transform: scale(1.1);
        }

        .listening {
            border-color: #00aa88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 #00aa8866; }
            70% { box-shadow: 0 0 0 20px #00aa8800; }
            100% { box-shadow: 0 0 0 0 #00aa8800; }
        }

        #status { font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        #log { width: 80%; height: 150px; overflow-y: auto; border-top: 1px solid #333; padding: 20px; font-size: 14px; color: #888; text-align: left; }
        
        .user-text { color: #fff; }
        .jarvis-text { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <div id="core" onclick="startSystem()">
        <div style="font-size: 50px;">⚛️</div>
    </div>

    <div id="status">🔴 OFFLINE (Click Reactor)</div>
    <div id="log"></div>

    <script>
        // --- CONFIGURATION ---
        const BACKEND_URL = "ws://localhost:8000/ws/chat"; 
        const WAKE_WORD = "jarvis"; 
        // ---------------------

        const ws = new WebSocket(BACKEND_URL);
        const core = document.getElementById("core");
        const statusDiv = document.getElementById("status");
        const logDiv = document.getElementById("log");
        
        let isSpeaking = false; 
        let recognition;

        // 1. WebSocket Connection
        ws.onopen = () => {
            log("System: Connected to Neural Net.");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === "response") {
                log("🧠 Jarvis: " + data.text, "jarvis-text");
                speak(data.text);
            } else if (data.type === "system_stats") {
                console.log(data);
            }
        };

        // 2. Voice Recognition Setup
        function setupVoice() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new Recognition();
            
            recognition.continuous = true; 
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (!isSpeaking) {
                    statusDiv.innerHTML = "👂 LISTENING...";
                    core.classList.add("listening");
                }
            };

            recognition.onend = () => {
                // AUTO-RESTART: Only restart if we are NOT currently speaking
                if (!isSpeaking) {
                    console.log("Mic stopped. Restarting...");
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = (event) => {
                console.warn("Speech Error:", event.error);
                // Ignore 'no-speech' errors, just stay alive
                if (event.error === 'not-allowed') {
                    statusDiv.innerHTML = "❌ MIC BLOCKED";
                }
            };

            recognition.onresult = (event) => {
                if (isSpeaking) return; 

                const lastIndex = event.results.length - 1;
                const transcript = event.results[lastIndex][0].transcript.trim().toLowerCase();
                
                console.log("Heard:", transcript);

                // Check for Wake Word
                if (transcript.includes(WAKE_WORD)) {
                    activateCore();
                    log("🗣️ You: " + transcript, "user-text");
                    ws.send(JSON.stringify({ type: "command", text: transcript }));
                }
            };
        }

        // 3. Text to Speech (The Mouth)
        function speak(text) {
            isSpeaking = true; 
            try { recognition.stop(); } catch(e) {} // Stop listening
            
            core.classList.remove("listening");
            core.classList.add("active");
            statusDiv.innerHTML = "🗣️ SPEAKING...";

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            utterance.voice = voices.find(v => v.name.includes("Google US English")) || voices[0];
            
            utterance.onend = () => {
                console.log("Finished speaking. Resuming listening...");
                isSpeaking = false;
                deactivateCore();
                
                // Add a tiny delay to ensure mic is ready
                setTimeout(() => {
                    try { recognition.start(); } catch(e) {}
                }, 200);
            };
            
            window.speechSynthesis.speak(utterance);
        }

        function activateCore() {
            core.classList.add("active");
            core.classList.remove("listening");
            statusDiv.innerHTML = "⚡ PROCESSING...";
        }

        function deactivateCore() {
            core.classList.remove("active");
            core.classList.add("listening");
            statusDiv.innerHTML = "👂 LISTENING...";
        }

        function log(msg, className="") {
            logDiv.innerHTML += `<div class="${className}">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function startSystem() {
            setupVoice();
            try { recognition.start(); } catch(e) { console.log("Already started"); }
        }
    </script>
</body>
</html>
